    <!-- IBM Plex Sans is the UI font (see src/theme/chakra-system.ts); JetBrains
         Mono is used for code. Linked here so they are discovered in the initial
         HTML instead of after the bundled CSS.

         Served from this origin rather than from Google: the stylesheet that
         used to sit here had every visitor's browser announce itself to
         fonts.googleapis.com and fonts.gstatic.com before a single pixel was
         drawn. Both families are still variable and still subset by
         unicode-range, so a Latin reader downloads neither the Cyrillic nor
         the Greek cut. See public/fonts.css. -->
    <link rel="preload" as="style" href="/fonts.css" />
    <link rel="stylesheet" href="/fonts.css" />

  <body>
    <div id="root"></div>
    <script>
      /*
       * Every route without a file of its own is served the prerendered landing
       * document. On an app route that markup is wrong twice over: it is the
       * landing, and it paints unstyled, because Emotion keeps its rules in the
       * CSSOM and only the class names survive into static HTML. Drop it here,
       * while the parser is still working, so the editor never flashes a stray
       * landing page before its own shell appears.
       *
       * The route list is injected at build time from scripts/publicRoutes.mjs.
       */
      (function () {
        var prerendered = __PRERENDERED_ROUTES__;
        var path = location.pathname.replace(/\/+$/, '') || '/';
        if (prerendered.indexOf(path) !== -1) return;
        document.documentElement.removeAttribute('data-page-scroll');
        var root = document.getElementById('root');
        if (root) root.textContent = '';
      })();
    </script>
